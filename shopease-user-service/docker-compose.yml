services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopease-user-service
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      AUTH_SERVICE_URL: http://host.docker.internal:8002
    ports:
      - "8003:8003"
    restart: unless-stopped
